<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171b2d">
<title>KABEL MARKET</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5f9;
 color:#172033;
}
header{
 background:#171b2d;
 color:white;
 padding:20px 16px;
}
header h2{margin:0 0 12px}
.search{
 width:100%;
 padding:13px;
 border:0;
 border-radius:10px;
 font-size:15px;
}
.categories{
 display:flex;
 overflow-x:auto;
 gap:9px;
 padding:14px;
}
.categories button{
 border:0;
 padding:10px 15px;
 border-radius:20px;
 background:white;
 white-space:nowrap;
}
.categories button.active{
 background:#ffca28;
}
main{padding:10px 14px}
.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.product{
 background:white;
 border-radius:13px;
 overflow:hidden;
 box-shadow:0 2px 8px #0000000d;
}
.product img{
 width:100%;
 height:135px;
 object-fit:contain;
 background:#fff;
}
.info{padding:10px}
.info h3{font-size:15px;margin:0 0 7px}
.price{
 color:#e69b00;
 font-weight:bold;
 margin:8px 0;
}
.add{
 width:100%;
 border:0;
 border-radius:9px;
 background:#ffca28;
 padding:11px;
 font-weight:bold;
}
.cart{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 padding:14px;
 background:white;
 box-shadow:0 -2px 12px #0002;
}
.cart button{
 width:100%;
 padding:14px;
 background:#171b2d;
 color:white;
 border:0;
 border-radius:10px;
 font-size:16px;
}
#status{text-align:center;padding:15px;color:#777}
</style>
</head>

<body>

<header>
 <h2>⚡ KABEL MARKET</h2>
 <input id="search" class="search"
 placeholder="Mahsulot qidirish...">
</header>

<div class="categories" id="categories">
 <button class="active" data-category="all">Barchasi</button>
</div>

<main>
 <div id="status">Mahsulotlar yuklanmoqda...</div>
 <div class="products" id="products"></div>
</main>

<div class="cart">
 <button onclick="showCart()">
 🛒 Savatcha: <span id="cartCount">0</span>
 </button>
</div>

<script>
const SUPABASE_URL =
"https://ncfmpgqdcjhsoifijnxr.supabase.co";

const SUPABASE_KEY = "BU_YERGA_SUPABASE_PUBLISHABLE_KEY";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let products = [];
let cart = [];
let selectedCategory = "all";

async function loadProducts(){
 const status = document.getElementById("status");

 try{
  const {data,error} = await db
   .from("products")
   .select("id,name,category,description,price,amperage,image_url,stock")
   .order("created_at",{ascending:false});

  if(error) throw error;

  products = data || [];
  renderCategories();
  renderProducts();

  status.textContent = products.length
   ? ""
   : "Hozircha mahsulotlar mavjud emas";

 }catch(error){
  status.textContent =
   "Xatolik: " + error.message;
 }
}

function renderCategories(){
 const box = document.getElementById("categories");
 const categories = [
  ...new Set(products.map(p=>p.category).filter(Boolean))
 ];

 box.innerHTML =
 '<button class="active" data-category="all">Barchasi</button>';

 categories.forEach(category=>{
  const button = document.createElement("button");
  button.textContent = category;
  button.dataset.category = category;
  box.appendChild(button);
 });

 box.querySelectorAll("button").forEach(button=>{
  button.onclick = ()=>{
   selectedCategory = button.dataset.category;
   box.querySelectorAll("button").forEach(b=>
    b.classList.toggle("active",b===button)
   );
   renderProducts();
  };
 });
}

function renderProducts(){
 const box = document.getElementById("products");
 const query = document.getElementById("search").value.toLowerCase();

 box.innerHTML = "";

 const filtered = products.filter(p=>{
  const categoryMatch =
   selectedCategory === "all" ||
   p.category === selectedCategory;
   const searchMatch =
   (p.name || "").toLowerCase().includes(query);

  return categoryMatch && searchMatch;
 });

 filtered.forEach(p=>{
  const card = document.createElement("div");
  card.className = "product";

  const img = document.createElement("img");
  img.src = p.image_url || "";
  img.alt = p.name || "Mahsulot";
  img.onerror = ()=>img.style.display="none";

  const info = document.createElement("div");
  info.className = "info";

  const name = document.createElement("h3");
  name.textContent = p.name || "Mahsulot";

  const description = document.createElement("p");
  description.textContent = p.description || "";
  
  const price = document.createElement("div");
  price.className = "price";
  price.textContent =
   Number(p.price || 0).toLocaleString("uz-UZ") + " so'm";

  const add = document.createElement("button");
  add.className = "add";
  add.textContent = "Savatga qo‘shish";
  add.onclick = ()=>addToCart(p.id);

  info.append(name,description,price,add);
  card.append(img,info);
  box.appendChild(card);
 });
}

function addToCart(id){
 const item = cart.find(x=>x.id===id);

 if(item) item.quantity++;
 else cart.push({id,quantity:1});

 updateCart();
}

function updateCart(){
 const count = cart.reduce((sum,item)=>
  sum+item.quantity,0
 );
 document.getElementById("cartCount").textContent=count;
}

function showCart(){
 if(!cart.length){
  alert("Savatcha bo‘sh");
  return;
 }

 let total = 0;
 let message = "SAVATCHA:\n\n";

 cart.forEach(item=>{
  const p = products.find(x=>x.id===item.id);
  if(!p) return;

  const sum = Number(p.price || 0)*item.quantity;
  total += sum;

  message += p.name + " x " + item.quantity +
   " = " + sum.toLocaleString("uz-UZ") + " so'm\n";
 });

 message += "\nJami: " +
  total.toLocaleString("uz-UZ") + " so'm";

 alert(message);
}

document.getElementById("search").addEventListener(
 "input",renderProducts
);

loadProducts();
</script>

</body>
</html>
