<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>KABEL MARKET</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#172033}
header{background:#101827;color:white;padding:18px}
header h2{margin:0}
header p{margin:6px 0 0;color:#cbd5e1}
.search{padding:15px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.categories{display:flex;gap:8px;overflow:auto;padding:0 15px 15px}
.categories button{border:0;background:white;padding:11px 16px;border-radius:20px;white-space:nowrap}
.categories button.active{background:#172b4d;color:white}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px 100px}
.product{background:white;border-radius:14px;padding:10px;overflow:hidden}
.product img{width:100%;height:135px;object-fit:contain;background:#f8fafc;border-radius:10px}
.product h3{font-size:15px;margin:10px 0 6px}
.price{font-weight:bold;color:#087b45;margin:7px 0}
.product button,.mainbtn{width:100%;border:0;background:#1769e0;color:white;padding:12px;border-radius:10px;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px;box-shadow:0 -2px 12px #0001}
.bottom button{width:100%;padding:15px;background:#101827;color:white;border:0;border-radius:12px;font-size:16px}
#cartPanel{display:none;background:white;padding:18px;margin:12px;border-radius:15px}
.cartitem{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:15px}
.modalbox{background:white;width:100%;max-width:400px;padding:20px;border-radius:16px}
.modalbox input{margin:7px 0}
.close{float:right;border:0;background:#eee;padding:8px;border-radius:8px}
#message{text-align:center;padding:20px;color:#666}
</style>
</head>

<body>

<header>
<h2>⚡ KABEL MARKET</h2>
<p>Elektr mahsulotlari internet do‘koni</p>
</header>

<div class="search">
<input id="search" placeholder="🔎 Mahsulot qidirish..." oninput="renderProducts()">
</div>

<div class="categories" id="categories"></div>

<div id="message">Mahsulotlar yuklanmoqda...</div>
<div class="products" id="products"></div>

<div id="cartPanel">
<h3>🛒 Savatcha</h3>
<div id="cartItems"></div>
<h3 id="total">Jami: 0 so‘m</h3>
<button class="mainbtn" onclick="openOrder()">Buyurtma berish</button>
</div>

<div class="bottom">
<button onclick="toggleCart()">🛒 Savatcha (<span id="cartCount">0</span>)</button>
</div>

<div class="modal" id="orderModal">
<div class="modalbox">
<button class="close" onclick="closeOrder()">✕</button>
<h3>Buyurtma berish</h3>
<input id="customerName" placeholder="Ismingiz">
<input id="customerPhone" placeholder="Telefon raqamingiz">
<input id="customerAddress" placeholder="Manzilingiz">
<button class="mainbtn" onclick="sendOrder()">Buyurtmani yuborish</button>
<p id="orderMessage"></p>
</div>
</div>

<script>
const SUPABASE_URL = "https://ncfmpgqdcjhsoifijnxr.supabase.co";
const SUPABASE_KEY = "sb_publishable_L1BOMVyFFWqEJUFjbALqig_V8oO5kHz";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const tg = window.Telegram?.WebApp;
if(tg){
  tg.ready();
  tg.expand();
}

let products = [];
let categories = [];
let cart = [];
let selectedCategory = "all";

function money(value){
  return Number(value || 0).toLocaleString("uz-UZ") + " so‘m";
}

async function loadData(){
  try{
    const [p,c] = await Promise.all([
      db.from("products").select("*").order("id",{ascending:false}),
      db.from("categories").select("*").order("id")
    ]);

    if(p.error) throw p.error;
    if(c.error) throw c.error;

    products = p.data || [];
    categories = c.data || [];
renderCategories();
    renderProducts();

    document.getElementById("message").textContent =
      products.length ? "" : "Hozircha mahsulot mavjud emas.";
  }catch(error){
    document.getElementById("message").textContent =
      "Xatolik: " + error.message;
  }
}

function renderCategories(){
  const box = document.getElementById("categories");

  box.innerHTML =
    <button class="${selectedCategory==="all"?"active":""}"
    onclick="chooseCategory('all')">Barchasi</button> +
    categories.map(c=>
      <button class="${String(selectedCategory)===String(c.id)?"active":""}"
      onclick="chooseCategory('${c.id}')">
      ${escapeHTML(c.name)}
      </button>
    ).join("");
}

function chooseCategory(id){
  selectedCategory = id;
  renderCategories();
  renderProducts();
}

function renderProducts(){
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = products.filter(p=>{
    const matchName = (p.name || "").toLowerCase().includes(search);
    const matchCategory = selectedCategory==="all" ||
      String(p.category_id)===String(selectedCategory);
    return matchName && matchCategory;
  });

  document.getElementById("products").innerHTML =
    filtered.map(p=>
      <div class="product">
        <img src="${safeImage(p.image_url)}"
             alt="${escapeHTML(p.name)}"
             onerror="this.src='https://placehold.co/300x200?text=KABEL+MARKET'">
        <h3>${escapeHTML(p.name)}</h3>
        <div class="price">${money(p.price)}</div>
        <p>Omborda: ${Number(p.stock || 0)}</p>
        <button onclick="addCart(${Number(p.id)})">Savatchaga qo‘shish</button>
      </div>
    ).join("");

  document.getElementById("message").textContent =
    filtered.length ? "" : "Mahsulot topilmadi.";
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function safeImage(value){
  try{
    const url = new URL(value);
    if(url.protocol==="https:" || url.protocol==="http:"){
      return url.href;
    }
  }catch(e){}
  return "https://placehold.co/300x200?text=KABEL+MARKET";
}

function addCart(id){
  const product = products.find(p=>Number(p.id)===id);
  if(!product) return;

  const item = cart.find(x=>x.id===id);

  if(item){
    if(item.quantity >= Number(product.stock || 0)){
      alert("Omborda mahsulot yetarli emas");
      return;
    }
    item.quantity++;
  }else{
    if(Number(product.stock || 0)<1){
      alert("Mahsulot omborda yo‘q");
      return;
    }
    cart.push({...product,quantity:1});
  }

  updateCart();
}

function updateCart(){
  document.getElementById("cartCount").textContent =
    cart.reduce((s,x)=>s+x.quantity,0);

  document.getElementById("cartItems").innerHTML =
    cart.map(x=>
      <div class="cartitem">
        <div>
          <b>${escapeHTML(x.name)}</b><br>
          ${money(x.price)} × ${x.quantity}
        </div>
        <div>
          <button onclick="changeQty(${x.id},-1)">−</button>
          <button onclick="changeQty(${x.id},1)">+</button>
        </div>
      </div>
    ).join("");

  const total = cart.reduce((s,x)=>s+Number(x.price)*x.quantity,0);
  document.getElementById("total").textContent = "Jami: "+money(total);
}

function changeQty(id,change){
  const item = cart.find(x=>x.id===id);
  if(!item) return;

  const product = products.find(p=>Number(p.id)===id);
  const next = item.quantity+change;

  if(next<=0){
    cart = cart.filter(x=>x.id!==id);
  }else if(next<=Number(product.stock || 0)){
    item.quantity=next;
  }else{
    alert("Omborda mahsulot yetarli emas");
  }

  updateCart();
}

function toggleCart(){
  const panel=document.getElementById("cartPanel");
  panel.style.display=panel.style.display==="block"?"none":"block";
}

function openOrder(){
  if(!cart.length){
    alert("Savatcha bo‘sh");
    return;
  }
  document.getElementById("orderModal").style.display="flex";
}

function closeOrder(){
  document.getElementById("orderModal").style.display="none";
}
async function sendOrder(){
  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const address=document.getElementById("customerAddress").value.trim();
  const message=document.getElementById("orderMessage");

  if(!name || !phone){
    message.textContent="Ism va telefon raqamini kiriting.";
    return;
  }

  if(!cart.length){
    message.textContent="Savatcha bo‘sh.";
    return;
  }

  const total=cart.reduce((s,x)=>s+Number(x.price)*x.quantity,0);

  message.textContent="Buyurtma yuborilmoqda...";

  try{
    const {data:order,error:orderError}=await db
      .from("orders")
      .insert({
        customer_name:name,
        phone:phone,
        address:address,
        total:total
      })
      .select("id")
      .single();

    if(orderError) throw orderError;

    const items=cart.map(x=>({
      order_id:order.id,
      product_id:x.id,
      product_name:x.name,
      quantity:x.quantity,
      price:x.price
    }));

    const {error:itemError}=await db
      .from("order_items")
      .insert(items);

    if(itemError) throw itemError;

    message.textContent="Buyurtmangiz qabul qilindi!";

    cart=[];
    updateCart();
    document.getElementById("customerName").value="";
    document.getElementById("customerPhone").value="";
    document.getElementById("customerAddress").value="";

    setTimeout(()=>{
      closeOrder();
      document.getElementById("cartPanel").style.display="none";
    },1800);

  }catch(error){
    message.textContent="Xatolik: "+error.message;
  }
}

loadData();
</script>

</body>
</html>
