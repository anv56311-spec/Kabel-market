<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171b2d">
<title>KABEL MARKET</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5f9;
 color:#172033;
 padding-bottom:100px;
}
header{
 background:#171b2d;
 color:white;
 padding:22px 16px;
}
header h2{margin:0 0 15px;font-size:25px}
.search{
 width:100%;padding:15px;
 border:0;border-radius:12px;
 font-size:16px;outline:none;
}
.categories{
 display:flex;overflow-x:auto;gap:9px;
 padding:15px;scrollbar-width:none;
}
.categories button{
 border:0;padding:11px 17px;
 border-radius:22px;background:white;
 white-space:nowrap;font-weight:bold;
}
.categories button.active{background:#ffca28}
main{padding:5px 14px}
.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.product{
 background:white;border-radius:14px;
 overflow:hidden;box-shadow:0 2px 8px #0000000d;
}
.product img{
 width:100%;height:145px;
 object-fit:contain;background:#fff;
}
.info{padding:11px}
.info h3{font-size:15px;margin:0 0 7px}
.description{
 font-size:12px;color:#777;
 min-height:28px;
}
.price{
 color:#d99200;font-weight:bold;
 margin:9px 0;
}
.stock{font-size:12px;color:#777;margin-bottom:9px}
.add{
 width:100%;border:0;border-radius:9px;
 background:#ffca28;padding:12px;
 font-weight:bold;
}
.add:disabled{background:#ddd;color:#777}
.cart{
 position:fixed;bottom:0;left:0;width:100%;
 padding:12px 15px;
 background:white;box-shadow:0 -2px 12px #0002;
 padding-bottom:max(12px,env(safe-area-inset-bottom));
}
.cart button{
 width:100%;padding:15px;
 background:#171b2d;color:white;
 border:0;border-radius:12px;
 font-size:17px;font-weight:bold;
}
#status{text-align:center;padding:20px;color:#777}
.modal{
 display:none;position:fixed;inset:0;
 background:#0009;z-index:10;
 align-items:flex-end;
}
.modal-content{
 background:white;width:100%;
 max-height:85vh;overflow:auto;
 border-radius:20px 20px 0 0;
 padding:20px;
}
.modal-content h2{margin-top:0}
.cart-item{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;
 padding:12px 0;border-bottom:1px solid #eee;
}
.qty button{
 border:0;background:#ffca28;
 padding:7px 12px;border-radius:7px;
}
.total{font-size:19px;font-weight:bold;margin:18px 0}
.close{
 float:right;border:0;background:#eee;
 padding:8px 12px;border-radius:8px;
}
.checkout{
 width:100%;padding:14px;
 background:#ffca28;border:0;
 border-radius:10px;font-weight:bold;
 font-size:16px;
}
</style>
</head>

<body>

<header>
 <h2>⚡ KABEL MARKET</h2>
 <input id="search" class="search"
 placeholder="Mahsulot qidirish...">
</header>

<div class="categories" id="categories">
 <button class="active" data-category="all">Barchasi</button>
</div>

<main>
 <div id="status">Mahsulotlar yuklanmoqda...</div>
 <div class="products" id="products"></div>
</main>

<div class="cart">
 <button onclick="showCart()">
 🛒 Savatcha: <span id="cartCount">0</span>
 </button>
</div>

<div class="modal" id="cartModal" onclick="closeOutside(event)">
 <div class="modal-content">
  <button class="close" onclick="closeCart()">✕</button>
  <h2>🛒 Savatcha</h2>
  <div id="cartItems"></div>
  <div class="total" id="cartTotal">Jami: 0 so'm</div>
  <button class="checkout" onclick="checkout()">
   Buyurtma berish
  </button>
 </div>
</div>

<script>
// SUPABASE SOZLAMALARI
const SUPABASE_URL =
"https://ncfmpgqdcjhsoifijnxr.supabase.co";

// Oldin bergan publishable kalitingiz:
const SUPABASE_KEY =
"sb_publishable_L1BOMVyFFWqEJUFjbALqig_V8oO5kHz";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

// TELEGRAM
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let products = [];
let cart = [];
let selectedCategory = "all";

const money = n =>
 Number(n || 0).toLocaleString("uz-UZ") + " so'm";
// MAHSULOTLARNI YUKLASH
async function loadProducts(){
 const status = document.getElementById("status");

 status.textContent = "Mahsulotlar yuklanmoqda...";

 try{
  const {data,error} = await db
   .from("products")
   .select("id,name,category,description,price,amperage,image_url,stock,created_at")
   .order("created_at",{ascending:false});

  if(error) throw error;

  products = data || [];

  renderCategories();
  renderProducts();

  status.textContent = products.length
   ? ""
   : "Hozircha mahsulotlar mavjud emas";

 }catch(error){
  console.error(error);
  status.textContent = "Xatolik: " + error.message;
 }
}

// KATEGORIYALAR
function renderCategories(){
 const box = document.getElementById("categories");

 const categories = [
  ...new Set(
   products.map(p=>p.category).filter(Boolean)
  )
 ];

 box.innerHTML = "";

 const all = document.createElement("button");
 all.textContent = "Barchasi";
 all.dataset.category = "all";
 all.className = selectedCategory === "all" ? "active" : "";
 box.appendChild(all);

 categories.forEach(category=>{
  const button = document.createElement("button");
  button.textContent = category;
  button.dataset.category = category;
  if(selectedCategory === category)
   button.className = "active";
  box.appendChild(button);
 });

 box.querySelectorAll("button").forEach(button=>{
  button.onclick = ()=>{
   selectedCategory = button.dataset.category;
   renderCategories();
   renderProducts();
  };
 });
}

// KATALOG
function renderProducts(){
 const box = document.getElementById("products");
 const query = document.getElementById("search")
  .value.toLowerCase().trim();

 box.innerHTML = "";

 const filtered = products.filter(p=>{
  const categoryMatch =
   selectedCategory === "all" ||
   p.category === selectedCategory;

  const searchText = [
   p.name,p.description,p.category,p.amperage
  ].filter(Boolean).join(" ").toLowerCase();

  return categoryMatch && searchText.includes(query);
 });

 filtered.forEach(p=>{
  const card = document.createElement("div");
  card.className = "product";

  const img = document.createElement("img");
  img.src = p.image_url || "";
  img.alt = p.name || "Mahsulot";
  img.onerror = ()=>{
   img.style.display = "none";
  };

  const info = document.createElement("div");
  info.className = "info";

  const name = document.createElement("h3");
  name.textContent = p.name || "Mahsulot";

  const description = document.createElement("p");
  description.className = "description";
  description.textContent =
   p.description  p.amperage  "";

  const price = document.createElement("div");
  price.className = "price";
  price.textContent = money(p.price);

  const stock = document.createElement("div");
  stock.className = "stock";
  stock.textContent = "Omborda: " + (p.stock ?? "Mavjud");

  const add = document.createElement("button");
  add.className = "add";
  add.textContent = "Savatga qo‘shish";
  add.disabled = Number(p.stock) <= 0;
  if(add.disabled) add.textContent = "Mavjud emas";

  add.onclick = ()=>addToCart(p.id);

  info.append(name,description,price,stock,add);
  card.append(img,info);
  box.appendChild(card);
 });

 if(!filtered.length){
  const empty = document.createElement("p");
  empty.textContent = "Mahsulot topilmadi";
  empty.style.gridColumn = "1/-1";
  empty.style.textAlign = "center";
  box.appendChild(empty);
 }
}

// SAVATCHAGA QO'SHISH
function addToCart(id){
 const p = products.find(x=>String(x.id)===String(id));
 if(!p) return;

 const item = cart.find(x=>String(x.id)===String(id));

 if(item){
  if(Number(p.stock) > 0 &&
     item.quantity >= Number(p.stock)){
   alert("Omborda bundan ortiq mahsulot yo‘q");
   return;
  }
  item.quantity++;
 }else{
  if(Number(p.stock) <= 0){
   alert("Mahsulot mavjud emas");
   return;
  }
  cart.push({id,quantity:1});
 }

 updateCart();
 tg?.HapticFeedback?.impactOccurred("light");
}

function updateCart(){
 const count = cart.reduce(
  (sum,item)=>sum+item.quantity,0
 );

 document.getElementById("cartCount").textContent = count;
}
// SAVATCHANI KO'RISH
function showCart(){
 renderCart();
 document.getElementById("cartModal").style.display = "flex";
}

function closeCart(){
 document.getElementById("cartModal").style.display = "none";
}

function closeOutside(event){
 if(event.target.id === "cartModal") closeCart();
}

function renderCart(){
 const box = document.getElementById("cartItems");
 box.innerHTML = "";

 let total = 0;

 cart.forEach(item=>{
  const p = products.find(
   x=>String(x.id)===String(item.id)
  );
  if(!p) return;

  const sum = Number(p.price || 0)*item.quantity;
  total += sum;

  const row = document.createElement("div");
  row.className = "cart-item";

  const title = document.createElement("div");
  title.textContent = p.name + " — " + money(sum);

  const controls = document.createElement("div");
  controls.className = "qty";

  const minus = document.createElement("button");
  minus.textContent = "−";
  minus.onclick = ()=>changeQty(item.id,-1);

  const number = document.createElement("span");
  number.textContent = " " + item.quantity + " ";

  const plus = document.createElement("button");
  plus.textContent = "+";
  plus.onclick = ()=>changeQty(item.id,1);

  controls.append(minus,number,plus);
  row.append(title,controls);
  box.appendChild(row);
 });

 document.getElementById("cartTotal").textContent =
  "Jami: " + money(total);
}

function changeQty(id,delta){
 const item = cart.find(x=>String(x.id)===String(id));
 const p = products.find(x=>String(x.id)===String(id));

 if(!item || !p) return;

 const next = item.quantity + delta;

 if(next <= 0){
  cart = cart.filter(x=>String(x.id)!==String(id));
 }else if(Number(p.stock) > 0 && next > Number(p.stock)){
  alert("Omborda bundan ortiq mahsulot yo‘q");
  return;
 }else{
  item.quantity = next;
 }

 updateCart();
 renderCart();
}

// BUYURTMA
function checkout(){
 if(!cart.length){
  alert("Savatcha bo‘sh");
  return;
 }

 const items = cart.map(item=>{
  const p = products.find(
   x=>String(x.id)===String(item.id)
  );

  return {
   product_id:p.id,
   name:p.name,
   price:Number(p.price || 0),
   quantity:item.quantity
  };
 });

 const total = items.reduce(
  (sum,item)=>sum+item.price*item.quantity,0
 );

 if(tg && tg.initData){
  tg.sendData(JSON.stringify({
   type:"new_order",
   items:items,
   total:total
  }));
  return;
 }

 alert(
  "Buyurtma summasi: " + money(total) +
  "\nBuyurtmani yuborish uchun Telegram Mini App orqali kiring."
 );
}

// QIDIRUV
document.getElementById("search").addEventListener(
 "input",renderProducts
);

// BOSHLASH
loadProducts();
</script>

</body>
</html>
